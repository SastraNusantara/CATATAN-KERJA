name: Build CATATAN KERJA APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project ZIP if needed
        shell: bash
        run: |
          set -euo pipefail

          # If Gradle files are already at the repository root, use them.
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE=""
            for candidate in \
              "$GITHUB_WORKSPACE/CatatanKerja-Revisi-Source.zip" \
              "$GITHUB_WORKSPACE/CatatanKerja-Android-Project.zip"; do
              if [ -f "$candidate" ]; then
                ZIP_FILE="$candidate"
                break
              fi
            done

            if [ -z "$ZIP_FILE" ]; then
              echo "Tidak ditemukan settings.gradle di root dan ZIP proyek Android tidak ditemukan."
              echo "Unggah CatatanKerja-Revisi-Source.zip ke root repositori atau unggah isi proyek Android."
              ls -la
              exit 1
            fi

            mkdir -p "$GITHUB_WORKSPACE/extracted-project"
            unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted-project"

            PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
            if [ -z "$PROJECT_DIR" ] || { [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; }; then
              echo "ZIP sudah diekstrak, tetapi settings.gradle tidak ditemukan."
              find "$GITHUB_WORKSPACE/extracted-project" -maxdepth 5 -type f | head -100
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyek Android ditemukan di: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CATATAN-KERJA-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
