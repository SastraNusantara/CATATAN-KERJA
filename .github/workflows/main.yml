name: Build CATATAN KERJA APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find, extract, and locate Android project
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip

          ROOT="$GITHUB_WORKSPACE"
          EXTRACT="$RUNNER_TEMP/catatan-kerja-extracted"
          mkdir -p "$EXTRACT"

          echo "Isi repositori:"
          find "$ROOT" -maxdepth 3 -type f | sort | head -200

          # If project is already at repository root, no extraction is needed.
          PROJECT=""
          if [ -f "$ROOT/settings.gradle" ] || [ -f "$ROOT/settings.gradle.kts" ]; then
            PROJECT="$ROOT"
          else
            # Extract every ZIP found in the repository.
            while IFS= read -r -d '' zfile; do
              echo "Mengekstrak: $zfile"
              unzip -o "$zfile" -d "$EXTRACT"
            done < <(find "$ROOT" -type f -iname '*.zip' -print0)

            # Locate the Gradle root after extraction.
            SETTINGS="$(find "$EXTRACT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [ -n "$SETTINGS" ]; then
              PROJECT="$(dirname "$SETTINGS")"
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::Tidak menemukan settings.gradle/settings.gradle.kts. Pastikan ZIP proyek Android diunggah ke repositori."
            echo "File hasil ekstraksi:"
            find "$EXTRACT" -maxdepth 7 -type f | sort | head -300
            exit 1
          fi

          if [ ! -d "$PROJECT/app" ]; then
            echo "::error::Folder proyek ditemukan, tetapi folder app tidak ada: $PROJECT"
            ls -la "$PROJECT"
            exit 1
          fi

          echo "Proyek Android ditemukan: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          ls -la "$PROJECT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CATATAN-KERJA-debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
