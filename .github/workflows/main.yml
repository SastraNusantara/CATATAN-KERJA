
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -type f -name 'CatatanKerja-Android-Project.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan!"
            find . -maxdepth 3 -type f
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d source

      - name: Build debug APK
        working-directory: source/CatatanKerja-Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanKerja-debug-apk
          path: source/CatatanKerja-Android/app/build/outputs/apk/debug/app-debug.apk
