name: Build CATATAN KERJA APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo 'ERROR: settings.gradle/settings.gradle.kts tidak ditemukan.'
            echo 'Pastikan isi proyek Android (termasuk settings.gradle, build.gradle, dan folder app) sudah diunggah ke repositori.'
            echo 'Isi folder repositori:'
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyek Android ditemukan di: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.project_dir }}"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CATATAN-KERJA-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
